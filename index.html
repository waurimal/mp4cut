<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 기반 MP4 자르기</title>

    <!-- Tailwind CSS (스타일링) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons (아이콘) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- ✅ FFmpeg.wasm v0.12.x (보안 에러를 유발하지 않는 최신 버전으로 교체!) -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

    <style>
        /* 추가적인 커스텀 스타일 */
        input[type="time"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
        }
        /* 드래그 앤 드롭 활성화 시 트랜지션 */
        #drop-zone {
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800 antialiased p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- 헤더 -->
        <div class="bg-blue-600 text-white p-6 flex items-center gap-3">
            <i data-lucide="scissors" class="w-8 h-8"></i>
            <div>
                <h1 class="text-2xl font-bold">웹 기반 MP4 자르기</h1>
                <p class="text-blue-100 text-sm mt-1">서버 업로드 없이 브라우저에서 안전하고 빠르게 동영상을 자릅니다.</p>
            </div>
        </div>

        <div class="p-6 md:p-8">
            <!-- 1. 파일 선택 (드래그 앤 드롭 영역) -->
            <div class="mb-8">
                <label class="block text-sm font-medium text-gray-700 mb-2">동영상 파일 선택 (MP4)</label>
                <div class="flex items-center justify-center w-full">
                    <!-- label로 복구하여 클릭 시 무한루프 충돌 방지 및 드래그 정상 인식 -->
                    <label id="drop-zone" for="file-input" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition relative">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6 pointer-events-none">
                            <i data-lucide="upload-cloud" class="w-10 h-10 text-gray-400 mb-3"></i>
                            <p class="mb-2 text-sm text-gray-500"><span class="font-semibold text-blue-600">클릭하여 파일 선택</span> 또는 여기로 드래그 앤 드롭</p>
                            <p class="text-xs text-gray-400 mt-1">MP4 형식 지원</p>
                        </div>
                        <input id="file-input" type="file" class="hidden" accept="video/mp4,video/x-m4v,video/*" />
                    </label>
                </div>
                <p id="file-name-display" class="mt-2 text-sm text-blue-600 font-medium hidden"></p>
            </div>

            <!-- 2. 동영상 미리보기 -->
            <div id="video-container" class="mb-8 hidden">
                <video id="video-preview" controls class="w-full rounded-xl bg-black shadow-inner aspect-video"></video>
            </div>

            <!-- 3. 시간 설정 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <!-- 시작 시간 -->
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <label class="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2">
                        <i data-lucide="play-circle" class="w-4 h-4 text-green-600"></i> 시작 시간
                    </label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="start-time" value="00:00:00.000" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono text-center" placeholder="HH:MM:SS.mmm">
                        <button id="set-start-btn" class="px-3 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm font-medium transition flex items-center gap-1">
                            <i data-lucide="crosshair" class="w-4 h-4"></i> 현재 위치
                        </button>
                    </div>
                </div>

                <!-- 종료 시간 -->
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <label class="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2">
                        <i data-lucide="stop-circle" class="w-4 h-4 text-red-600"></i> 종료 시간
                    </label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="end-time" value="00:00:00.000" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono text-center" placeholder="HH:MM:SS.mmm">
                        <button id="set-end-btn" class="px-3 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm font-medium transition flex items-center gap-1">
                            <i data-lucide="crosshair" class="w-4 h-4"></i> 현재 위치
                        </button>
                    </div>
                </div>
            </div>

            <!-- 메시지 출력 영역 -->
            <div id="message-box" class="hidden mb-6 p-4 rounded-lg flex items-start gap-3">
                <i id="message-icon" data-lucide="info" class="w-5 h-5 mt-0.5 flex-shrink-0"></i>
                <div id="message-text" class="text-sm font-medium"></div>
            </div>

            <!-- 실행 버튼 -->
            <button id="trim-btn" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-lg shadow-lg shadow-blue-200 transition-all flex items-center justify-center gap-2 disabled:bg-gray-400 disabled:cursor-not-allowed disabled:shadow-none">
                <i data-lucide="scissors" class="w-5 h-5"></i>
                동영상 자르기 실행
            </button>

            <!-- 다운로드 영역 -->
            <div id="download-container" class="mt-6 hidden flex flex-col items-center justify-center p-6 bg-green-50 border border-green-200 rounded-xl">
                <p class="text-green-800 font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="check-circle-2" class="w-5 h-5"></i> 처리가 완료되었습니다!
                </p>
                <a id="download-link" href="#" class="px-8 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold shadow-md transition flex items-center gap-2">
                    <i data-lucide="download" class="w-5 h-5"></i>
                    잘린 동영상 다운로드
                </a>
            </div>
        </div>
    </div>

    <!-- 푸터 (저작권 및 만든이) -->
    <footer class="mt-8 text-center text-sm text-gray-500 pb-8">
        <p>만든이: 곽현석(waurimal@snuecse.org)</p>
        <p class="mt-1">Copyright &copy; WaurimaL. All Rights Reserved.</p>
    </footer>

    <!-- JavaScript 로직 -->
    <script>
        // 아이콘 초기화
        lucide.createIcons();

        // 최신 FFmpeg v0.12.x 객체 가져오기
        const { FFmpeg } = window.FFmpegWASM;
        const { fetchFile } = window.FFmpegUtil;
        const ffmpeg = new FFmpeg();

        // DOM 요소
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name-display');
        const videoContainer = document.getElementById('video-container');
        const videoPreview = document.getElementById('video-preview');
        const startTimeInput = document.getElementById('start-time');
        const endTimeInput = document.getElementById('end-time');
        const setStartBtn = document.getElementById('set-start-btn');
        const setEndBtn = document.getElementById('set-end-btn');
        const trimBtn = document.getElementById('trim-btn');
        const messageBox = document.getElementById('message-box');
        const messageText = document.getElementById('message-text');
        const messageIcon = document.getElementById('message-icon');
        const downloadContainer = document.getElementById('download-container');
        const downloadLink = document.getElementById('download-link');

        let selectedFile = null;

        // 시간 포맷 함수 (초 -> HH:MM:SS.mmm)
        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            const ms = Math.floor((seconds % 1) * 1000).toString().padStart(3, '0');
            return `${h}:${m}:${s}.${ms}`;
        }

        // 메시지 표시 함수
        function showMessage(type, text) {
            messageBox.classList.remove('hidden', 'bg-red-50', 'text-red-800', 'bg-blue-50', 'text-blue-800', 'bg-yellow-50', 'text-yellow-800');
            messageBox.classList.add('flex');
            
            if (type === 'error') {
                messageBox.classList.add('bg-red-50', 'text-red-800');
                messageIcon.setAttribute('data-lucide', 'alert-circle');
            } else if (type === 'info') {
                messageBox.classList.add('bg-blue-50', 'text-blue-800');
                messageIcon.setAttribute('data-lucide', 'loader-2');
                messageIcon.classList.add('animate-spin');
            } else if (type === 'warning') {
                messageBox.classList.add('bg-yellow-50', 'text-yellow-800');
                messageIcon.setAttribute('data-lucide', 'alert-triangle');
            }
            
            messageText.innerHTML = text;
            lucide.createIcons(); // 아이콘 갱신
        }

        function hideMessage() {
            messageBox.classList.add('hidden');
            messageBox.classList.remove('flex');
            messageIcon.classList.remove('animate-spin');
        }

        // 1. 파일 처리 메인 함수
        function handleFile(file) {
            if (!file) return;
            
            // 동영상 파일인지 검증
            if (!file.type.startsWith('video/')) {
                showMessage('error', '동영상 파일만 업로드할 수 있습니다.');
                return;
            }

            selectedFile = file;
            
            // UI 업데이트
            fileNameDisplay.textContent = `선택된 파일: ${selectedFile.name}`;
            fileNameDisplay.classList.remove('hidden');
            
            // 기존 미리보기 URL 메모리 해제
            if (videoPreview.src) URL.revokeObjectURL(videoPreview.src);

            // 새 미리보기 영상 설정
            const videoURL = URL.createObjectURL(selectedFile);
            videoPreview.src = videoURL;
            videoContainer.classList.remove('hidden');
            
            // 메타데이터가 로드되면 종료 시간 설정
            videoPreview.onloadedmetadata = () => {
                startTimeInput.value = '00:00:00.000';
                endTimeInput.value = formatTime(videoPreview.duration);
            };

            hideMessage();
            downloadContainer.classList.add('hidden');
        }

        // ================= 드래그 앤 드롭 및 클릭 이벤트 =================
        // 클릭으로 파일 선택 시 (브라우저 기본 label 태그 기능 활용)
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        // 브라우저 화면 전체에 드롭했을 때 파일이 열려버리는 기본 동작 방지
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            window.addEventListener(eventName, preventDefaults, false);
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // 마우스가 영역 안으로 들어올 때 스타일 변경
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                dropZone.classList.add('bg-blue-50', 'border-blue-500');
                dropZone.classList.remove('border-gray-300', 'bg-gray-50');
            }, false);
        });

        // 마우스가 영역 밖으로 나갈 때 스타일 원상복구
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                dropZone.classList.remove('bg-blue-50', 'border-blue-500');
                dropZone.classList.add('border-gray-300', 'bg-gray-50');
            }, false);
        });

        // 파일을 떨어뜨렸을 때
        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files && files.length > 0) {
                fileInput.files = files; // input 요소에 파일 할당
                handleFile(files[0]);
            }
        });
        // ================================================================

        // 2. 현재 위치 시간 버튼 이벤트
        setStartBtn.addEventListener('click', () => {
            if (selectedFile) startTimeInput.value = formatTime(videoPreview.currentTime);
        });

        setEndBtn.addEventListener('click', () => {
            if (selectedFile) endTimeInput.value = formatTime(videoPreview.currentTime);
        });

        // 3. 자르기 실행 이벤트
        trimBtn.addEventListener('click', async () => {
            if (!selectedFile) {
                showMessage('error', '먼저 자를 동영상 파일을 선택해주세요.');
                return;
            }

            try {
                trimBtn.disabled = true;
                downloadContainer.classList.add('hidden');
                
                // FFmpeg 로드 (최초 1회만 실행됨)
                if (!ffmpeg.loaded) {
                    showMessage('info', '초기화 중입니다. (최초 1회 코어 파일 로딩에 시간이 걸릴 수 있습니다...)');
                    await ffmpeg.load({
                        coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
                        wasmURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm'
                    });
                }

                showMessage('info', '파일을 가상 메모리에 복사하고 있습니다...');
                await ffmpeg.writeFile('input.mp4', await fetchFile(selectedFile));

                const start = startTimeInput.value;
                const end = endTimeInput.value;

                showMessage('info', `동영상을 자르는 중입니다...<br><span class="text-xs text-blue-600 mt-1 block">구간: ${start} ~ ${end} (인코딩 없이 고속 처리 중)</span>`);
                
                // 자르기 명령어 실행 (최신 버전 API 규격 반영)
                await ffmpeg.exec(['-i', 'input.mp4', '-ss', start, '-to', end, '-c', 'copy', 'output.mp4']);

                showMessage('info', '처리가 완료되어 파일을 생성하고 있습니다...');
                
                // 결과 파일 읽기
                const data = await ffmpeg.readFile('output.mp4');

                // Blob 및 다운로드 링크 생성
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);

                downloadLink.href = url;
                downloadLink.download = `잘림_${selectedFile.name}`;
                downloadContainer.classList.remove('hidden');

                hideMessage();

                // 가상 메모리 확보를 위해 임시 파일 삭제
                try {
                    await ffmpeg.deleteFile('input.mp4');
                    await ffmpeg.deleteFile('output.mp4');
                } catch(e) {}

            } catch (error) {
                console.error(error);
                showMessage('error', `작업 중 오류가 발생했습니다: ${error.message}`);
            } finally {
                trimBtn.disabled = false;
                if(messageIcon) messageIcon.classList.remove('animate-spin');
            }
        });
    </script>
</body>
</html>
