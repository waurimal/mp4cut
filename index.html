<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 기반 MP4 자르기</title>

    <!-- 꼬여버린 서비스 워커 캐시를 안전하게 청소하는 스크립트 -->
    <script>
        window.addEventListener('load', () => {
            try {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(registrations) {
                        for(let registration of registrations) {
                            registration.unregister().then(() => {
                                console.log('과거 캐시 워커 삭제 완료');
                            }).catch(() => {});
                        }
                    }).catch(() => {});
                }
            } catch (e) {}
        });
    </script>

    <!-- Tailwind CSS (스타일링) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons (아이콘) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- ✅ FFmpeg.wasm v0.12.x (공식 가이드라인의 unpkg CDN 적용) -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

    <style>
        input[type="time"]::-webkit-calendar-picker-indicator { cursor: pointer; }
        #drop-zone { transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800 antialiased p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- 헤더 -->
        <div class="bg-blue-600 text-white p-6 flex items-center gap-3">
            <i data-lucide="scissors" class="w-8 h-8"></i>
            <div>
                <h1 class="text-2xl font-bold">웹 기반 MP4 자르기</h1>
                <p class="text-blue-100 text-sm mt-1">서버 업로드 없이 브라우저에서 여러 구간을 한 번에 빠르게 자릅니다.</p>
            </div>
        </div>

        <div class="p-6 md:p-8">
            <!-- 1. 파일 선택 (드래그 앤 드롭 영역) -->
            <div class="mb-8">
                <label class="block text-sm font-medium text-gray-700 mb-2">동영상 파일 선택 (MP4)</label>
                <div class="flex items-center justify-center w-full">
                    <label id="drop-zone" for="file-input" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition relative">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6 pointer-events-none">
                            <i data-lucide="upload-cloud" class="w-10 h-10 text-gray-400 mb-3"></i>
                            <p class="mb-2 text-sm text-gray-500"><span class="font-semibold text-blue-600">클릭하여 파일 선택</span> 또는 여기로 드래그 앤 드롭</p>
                            <p class="text-xs text-gray-400 mt-1">MP4 형식 지원</p>
                        </div>
                        <input id="file-input" type="file" class="hidden" accept="video/mp4,video/x-m4v,video/*" />
                    </label>
                </div>
                <p id="file-name-display" class="mt-2 text-sm text-blue-600 font-medium hidden"></p>
            </div>

            <!-- 2. 동영상 미리보기 -->
            <div id="video-container" class="mb-8 hidden">
                <video id="video-preview" controls class="w-full rounded-xl bg-black shadow-inner aspect-video"></video>
            </div>

            <!-- 3. 시간 설정 (다중 구간 지원) -->
            <div class="mb-8">
                <div class="flex justify-between items-end mb-4 border-b border-gray-200 pb-2">
                    <label class="block text-sm font-bold text-gray-700">자를 구간 설정</label>
                    <button id="add-segment-btn" class="text-sm px-4 py-2 bg-blue-100 text-blue-700 font-bold rounded-lg hover:bg-blue-200 transition flex items-center gap-1 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        <i data-lucide="plus" class="w-4 h-4"></i> 구간 추가
                    </button>
                </div>
                
                <div id="segments-container" class="space-y-3">
                    <div class="text-center p-6 bg-gray-50 rounded-xl border border-gray-200 text-gray-400 text-sm">
                        먼저 동영상 파일을 선택해주세요.
                    </div>
                </div>
            </div>

            <!-- 메시지 출력 영역 -->
            <div id="message-box" class="hidden mb-6 p-4 rounded-lg flex items-start gap-3 w-full">
                <i id="message-icon" data-lucide="info" class="w-5 h-5 mt-0.5 flex-shrink-0"></i>
                <div id="message-text" class="text-sm font-medium w-full"></div>
            </div>

            <!-- 실행 버튼 -->
            <button id="trim-btn" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-lg shadow-lg shadow-blue-200 transition-all flex items-center justify-center gap-2 disabled:bg-gray-400 disabled:cursor-not-allowed disabled:shadow-none">
                <i data-lucide="scissors" class="w-5 h-5"></i>
                동영상 자르기 실행
            </button>

            <!-- 다운로드 영역 -->
            <div id="download-container" class="mt-6 hidden flex-col items-center justify-center p-6 bg-green-50 border border-green-200 rounded-xl w-full">
                <p class="text-green-800 font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="check-circle-2" class="w-6 h-6"></i> 처리가 완료되었습니다!
                </p>
                
                <div id="download-list" class="flex flex-col gap-2 w-full max-w-lg mb-6">
                    <!-- 자바스크립트로 추가됨 -->
                </div>

                <button id="download-all-btn" class="px-8 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold shadow-md transition flex items-center gap-2">
                    <i data-lucide="download-cloud" class="w-5 h-5"></i>
                    모두 다운로드
                </button>
            </div>
        </div>
    </div>

    <!-- 푸터 (저작권 및 만든이) -->
    <footer class="mt-8 text-center text-sm text-gray-500 pb-8">
        <p>만든이: 곽현석(waurimal@snuecse.org)</p>
        <p class="mt-1">Copyright &copy; WaurimaL. All Rights Reserved.</p>
    </footer>

    <!-- JavaScript 로직 -->
    <script>
        lucide.createIcons();

        // FFmpeg 객체 초기화
        const { FFmpeg } = window.FFmpegWASM;
        const { fetchFile, toBlobURL } = window.FFmpegUtil;
        const ffmpeg = new FFmpeg();

        // 내부 작업 상황을 브라우저 콘솔(F12)에 출력
        ffmpeg.on('log', ({ message }) => {
            console.log('[FFmpeg Log]', message);
        });

        // DOM 요소 연결
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name-display');
        const videoContainer = document.getElementById('video-container');
        const videoPreview = document.getElementById('video-preview');
        const trimBtn = document.getElementById('trim-btn');
        const messageBox = document.getElementById('message-box');
        const messageText = document.getElementById('message-text');
        const messageIcon = document.getElementById('message-icon');
        const downloadContainer = document.getElementById('download-container');
        const downloadList = document.getElementById('download-list');
        const downloadAllBtn = document.getElementById('download-all-btn');
        const segmentsContainer = document.getElementById('segments-container');
        const addSegmentBtn = document.getElementById('add-segment-btn');

        let selectedFile = null;

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            const ms = Math.floor((seconds % 1) * 1000).toString().padStart(3, '0');
            return `${h}:${m}:${s}.${ms}`;
        }

        function showMessage(type, text) {
            messageBox.classList.remove('hidden', 'bg-red-50', 'text-red-800', 'bg-blue-50', 'text-blue-800', 'bg-yellow-50', 'text-yellow-800');
            messageBox.classList.add('flex');
            
            if (type === 'error') {
                messageBox.classList.add('bg-red-50', 'text-red-800');
                messageIcon.setAttribute('data-lucide', 'alert-circle');
            } else if (type === 'info') {
                messageBox.classList.add('bg-blue-50', 'text-blue-800');
                messageIcon.setAttribute('data-lucide', 'loader-2');
                messageIcon.classList.add('animate-spin');
            } else if (type === 'warning') {
                messageBox.classList.add('bg-yellow-50', 'text-yellow-800');
                messageIcon.setAttribute('data-lucide', 'alert-triangle');
            }
            
            messageText.innerHTML = text;
            lucide.createIcons();
        }

        function hideMessage() {
            messageBox.classList.add('hidden');
            messageBox.classList.remove('flex');
            messageIcon.classList.remove('animate-spin');
        }

        // ================= 다중 구간 (Segments) 관리 로직 =================
        function updateSegmentIndices() {
            const items = segmentsContainer.querySelectorAll('.segment-item');
            items.forEach((item, index) => {
                item.querySelector('.segment-index').textContent = index + 1;
                item.querySelector('.remove-segment-btn').style.display = items.length === 1 ? 'none' : 'block';
            });
        }

        function addSegment(startVal = '00:00:00.000', endVal = '00:00:00.000') {
            const div = document.createElement('div');
            div.className = 'segment-item bg-white p-3 rounded-xl border border-gray-200 flex flex-col md:flex-row gap-3 items-center transition-all hover:shadow-md';
            div.innerHTML = `
                <div class="font-bold text-gray-500 w-full md:w-16 text-center md:text-left whitespace-nowrap">구간 <span class="segment-index"></span></div>
                <div class="flex-1 flex flex-col sm:flex-row gap-3 w-full">
                    <div class="flex-1 flex items-center gap-2 bg-gray-50 p-2 rounded-lg border border-gray-200">
                        <span class="text-xs text-blue-600 font-bold w-8 text-center bg-blue-100 rounded px-1 py-0.5">시작</span>
                        <input type="text" class="start-time flex-1 bg-transparent text-sm font-mono focus:outline-none text-center" value="${startVal}">
                        <button class="set-start-btn p-1.5 bg-gray-200 hover:bg-gray-300 rounded text-gray-700 transition"><i data-lucide="crosshair" class="w-4 h-4"></i></button>
                    </div>
                    <div class="flex-1 flex items-center gap-2 bg-gray-50 p-2 rounded-lg border border-gray-200">
                        <span class="text-xs text-red-600 font-bold w-8 text-center bg-red-100 rounded px-1 py-0.5">종료</span>
                        <input type="text" class="end-time flex-1 bg-transparent text-sm font-mono focus:outline-none text-center" value="${endVal}">
                        <button class="set-end-btn p-1.5 bg-gray-200 hover:bg-gray-300 rounded text-gray-700 transition"><i data-lucide="crosshair" class="w-4 h-4"></i></button>
                    </div>
                </div>
                <button class="remove-segment-btn text-red-400 hover:bg-red-50 hover:text-red-600 p-2 rounded transition"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
            `;

            div.querySelector('.set-start-btn').addEventListener('click', () => {
                if (selectedFile) div.querySelector('.start-time').value = formatTime(videoPreview.currentTime);
            });
            div.querySelector('.set-end-btn').addEventListener('click', () => {
                if (selectedFile) div.querySelector('.end-time').value = formatTime(videoPreview.currentTime);
            });
            div.querySelector('.remove-segment-btn').addEventListener('click', () => {
                div.remove();
                updateSegmentIndices();
            });

            segmentsContainer.appendChild(div);
            lucide.createIcons({ root: div });
            updateSegmentIndices();
        }

        addSegmentBtn.addEventListener('click', () => {
            addSegment('00:00:00.000', formatTime(videoPreview.duration));
        });

        // ================= 파일 핸들링 =================
        function handleFile(file) {
            if (!file) return;
            if (!file.type.startsWith('video/')) {
                showMessage('error', '동영상 파일만 업로드할 수 있습니다.');
                return;
            }

            selectedFile = file;
            fileNameDisplay.textContent = `선택된 파일: ${selectedFile.name}`;
            fileNameDisplay.classList.remove('hidden');
            
            if (videoPreview.src) URL.revokeObjectURL(videoPreview.src);

            videoPreview.src = URL.createObjectURL(selectedFile);
            videoContainer.classList.remove('hidden');
            
            videoPreview.onloadedmetadata = () => {
                segmentsContainer.innerHTML = '';
                addSegment('00:00:00.000', formatTime(videoPreview.duration));
                addSegmentBtn.disabled = false;
            };

            hideMessage();
            downloadContainer.classList.add('hidden');
            downloadContainer.classList.remove('flex');
        }

        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            window.addEventListener(eventName, preventDefaults, false);
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                dropZone.classList.add('bg-blue-50', 'border-blue-500');
                dropZone.classList.remove('border-gray-300', 'bg-gray-50');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                dropZone.classList.remove('bg-blue-50', 'border-blue-500');
                dropZone.classList.add('border-gray-300', 'bg-gray-50');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFile(e.dataTransfer.files[0]);
            }
        });

        downloadAllBtn.addEventListener('click', () => {
            downloadList.querySelectorAll('a').forEach((link, index) => {
                setTimeout(() => link.click(), index * 500); 
            });
        });

        // ================= 3. 자르기 실행 이벤트 =================
        trimBtn.addEventListener('click', async () => {
            const segments = segmentsContainer.querySelectorAll('.segment-item');
            
            if (!selectedFile) {
                showMessage('error', '먼저 자를 동영상 파일을 선택해주세요.');
                return;
            }
            if (segments.length === 0) {
                showMessage('error', '자를 구간이 설정되지 않았습니다.');
                return;
            }

            try {
                trimBtn.disabled = true;
                addSegmentBtn.disabled = true;
                downloadContainer.classList.add('hidden');
                downloadContainer.classList.remove('flex');
                downloadList.innerHTML = '';
                
                // 최초 1회 엔진 로드
                if (!ffmpeg.loaded) {
                    showMessage('info', `
                        <div class="font-bold text-base mb-1 text-blue-800">엔진 초기화 중...</div>
                        <div class="text-sm text-blue-700 font-medium">동영상 처리 모듈을 가져오고 있습니다. (최초 1회 한정)</div>
                        <div class="text-xs text-gray-500 leading-relaxed mt-2">
                            ※ 네트워크 환경에 따라 약 10~20초 가량 소요될 수 있습니다.
                        </div>
                    `);

                    // [에러 완벽 해결 원리]
                    // Web Worker 스크립트(814.ffmpeg.js)는 외부 도메인(unpkg)에서 바로 불러오면 Cross-Origin(CORS) 오류로 막힙니다.
                    // 따라서 이것 1개만 Blob으로 우회시켜 안전하게 로드합니다.
                    // 반대로 core.js와 core.wasm은 우회(Blob)하면 내부 경로를 찾지 못해 failed to import 에러를 냅니다.
                    // 따라서 코어 2개는 원래 CDN URL을 그대로 전달하여 충돌을 막습니다.
                    const coreURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
                    const ffmpegURL = 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd';
                    
                    let workerBlobURL;
                    try {
                        workerBlobURL = await toBlobURL(`${ffmpegURL}/814.ffmpeg.js`, 'text/javascript');
                    } catch (e) {
                        throw new Error("보안 우회 모듈을 다운로드하지 못했습니다. (네트워크나 애드블록 차단 확인 필요)");
                    }

                    try {
                        await ffmpeg.load({
                            coreURL: `${coreURL}/ffmpeg-core.js`,
                            wasmURL: `${coreURL}/ffmpeg-core.wasm`,
                            classWorkerURL: workerBlobURL
                        });
                        URL.revokeObjectURL(workerBlobURL); // 로딩 성공 후 메모리 정리
                    } catch (loadErr) {
                        throw new Error(`모듈 초기화 실패: ${loadErr.message}`);
                    }
                }

                showMessage('info', '파일을 메모리에 준비하고 있습니다...');
                
                // 원본 파일을 브라우저 가상 파일 시스템으로 복사
                await ffmpeg.writeFile('input.mp4', await fetchFile(selectedFile));

                const originalName = selectedFile.name.replace(/\.[^/.]+$/, "");
                const ext = selectedFile.name.split('.').pop() || 'mp4';
                let successCount = 0;

                // 순차적 자르기 로직 진행
                for (let i = 0; i < segments.length; i++) {
                    const start = segments[i].querySelector('.start-time').value;
                    const end = segments[i].querySelector('.end-time').value;
                    const padIndex = String(i + 1).padStart(2, '0');
                    const outName = `output_${i}.mp4`;
                    const finalName = segments.length === 1 ? `${originalName}_잘림.${ext}` : `${originalName}_${padIndex}.${ext}`;

                    showMessage('info', `<div class="mb-1"><span class="font-bold text-blue-700">[구간 ${i+1}/${segments.length}]</span> 처리 중...</div><div class="text-xs text-gray-600">설정시간: ${start} ~ ${end} (인코딩 없이 고속 복사 중)</div>`);
                    
                    try {
                        // -c copy 를 통해 재인코딩 없이 즉시 자르기
                        await ffmpeg.exec(['-i', 'input.mp4', '-ss', start, '-to', end, '-c', 'copy', outName]);
                        
                        const data = await ffmpeg.readFile(outName);
                        const blob = new Blob([data.buffer], { type: 'video/mp4' });
                        const url = URL.createObjectURL(blob);

                        // 성공한 파일을 목록에 표시
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = finalName;
                        a.className = 'flex items-center justify-between px-4 py-3 bg-white border border-gray-200 rounded-lg hover:border-blue-400 hover:bg-blue-50 transition shadow-sm w-full cursor-pointer';
                        a.innerHTML = `
                            <span class="text-sm font-bold text-gray-700 truncate mr-4">${finalName}</span>
                            <div class="flex items-center text-blue-600 text-sm font-medium gap-1 bg-white px-2 py-1 rounded border border-blue-200">
                                다운로드 <i data-lucide="download" class="w-4 h-4"></i>
                            </div>
                        `;
                        downloadList.appendChild(a);
                        lucide.createIcons({ root: a });
                        successCount++;

                        await ffmpeg.deleteFile(outName);
                    } catch(e) {
                        console.error(`구간 ${i+1} 처리 실패:`, e);
                    }
                }

                try { await ffmpeg.deleteFile('input.mp4'); } catch(e) {}

                hideMessage();
                if (successCount > 0) {
                    downloadContainer.classList.remove('hidden');
                    downloadContainer.classList.add('flex');
                    downloadAllBtn.style.display = successCount > 1 ? 'flex' : 'none';
                } else {
                    showMessage('error', '모든 구간을 처리하는 도중 오류가 발생했습니다.');
                }

            } catch (error) {
                console.error("작업 에러 발생:", error);
                const errorMsg = error instanceof Error ? error.message : (error?.message || String(error));
                showMessage('error', `<div class="font-bold">작업 중 오류가 발생했습니다.</div><div class="text-xs mt-1 text-red-600">${errorMsg}</div>`);
            } finally {
                trimBtn.disabled = false;
                addSegmentBtn.disabled = false;
                if(messageIcon) messageIcon.classList.remove('animate-spin');
            }
        });
    </script>
</body>
</html>
